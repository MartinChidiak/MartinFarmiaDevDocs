# Plantilla segura. Copiar como farmia-project.config.toml y usar rutas reales
# solo en ese archivo ignorado. No guardar tokens, passwords ni URLs con
# credenciales.

[machine]
id = "laptop-ejemplo"

[paths]
farmia_app = "C:\\dev\\farmia_app"
farmia_docs = "C:\\dev\\farmia_docs"
worktrees = "C:\\dev\\worktrees"

[runtime]
compose_command = "docker compose"
node_command = "node"
preferred_shell = "powershell"
